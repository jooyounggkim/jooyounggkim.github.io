# Site
locale: "en-US"
title: "Jooyoung Kim"
title_separator: ""
name: "Jooyoung Kim"
description: "Jooyoung Kim's personal website"
url: "https://www.jooyoungkim.org"
baseurl: ""
repository: "jooyounggkim/jooyounggkim.github.io"
og_image: "header_image.jpg"
breadcrumbs: false
timezone: "America/Los_Angeles"

author:
  name: "Jooyoung Kim"
  location: "San Diego, CA, USA"

# Build
theme: null
include:
  - _pages
exclude:
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .jekyll-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Gemfile
  - LICENSE
  - node_modules
  - README.md
  - tmp

encoding: "utf-8"
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      share: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

compress_html:
  clippings: all
  ignore:
    envs: development
